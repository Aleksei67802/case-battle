<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Case Battle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="logo">CASE<span>BATTLE</span></div>
      <div class="sub">MINI APP</div>
    </div>
    <div class="balance">💰 <b id="balance">2500</b></div>
  </header>

  <main>
    <section id="home" class="screen active">
      <div class="hero">
        <div class="case-glow"></div>
        <div class="case">🔒</div>
        <h1>Night Case</h1>
        <p>Открывай кейсы и собирай коллекцию</p>
        <button id="openBtn" class="primary">ОТКРЫТЬ КЕЙС · 250 💰</button>
      </div>

      <div class="section-title">Возможный дроп</div>
      <div id="previewGrid" class="grid"></div>
    </section>

    <section id="inventory" class="screen">
      <div class="page-title">Мой инвентарь</div>
      <div id="inventoryGrid" class="grid"></div>
    </section>

    <section id="battle" class="screen">
      <div class="page-title">Battle</div>
      <div class="battle-card">
        <div class="player"><span>YOU</span><strong>⚡</strong></div>
        <div class="vs">VS</div>
        <div class="player"><span>BOT</span><strong>🤖</strong></div>
      </div>
      <button id="battleBtn" class="primary">НАЧАТЬ BATTLE · 500 💰</button>
      <p class="hint">Демо-режим: бой происходит локально. Для настоящих PvP боёв нужен сервер.</p>
    </section>
  </main>

  <nav>
    <button data-screen="home" class="nav active">🏠<span>Кейсы</span></button>
    <button data-screen="inventory" class="nav">🎒<span>Инвентарь</span></button>
    <button data-screen="battle" class="nav">⚔️<span>Battle</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="rarity" id="resultRarity">LEGENDARY</div>
    <div id="resultImage" class="result-image">🔪</div>
    <h2 id="resultName">Karambit</h2>
    <p id="resultText">Предмет добавлен в инвентарь</p>
    <button id="closeModal" class="primary">ЗАБРАТЬ</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
